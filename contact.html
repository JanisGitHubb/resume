<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Janis Stendzenieks</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body class="subpage">
    <nav class="nav">
        <a href="./index.html" class="nav-logo">JS.</a>
        <div class="nav-links">
            <a href="./experience.html">Experience</a>
            <a href="./projects.html">Projects</a>
            <a href="./education.html">Education</a>
            <a href="./contact.html" class="active">Contact</a>
        </div>
    </nav>

    <section class="contact-hero">
        <img src="./assets/images/fly.jpg" alt="" class="index-hero-bg">
        <div class="index-hero-overlay"></div>
        <div class="contact-hero-content">
            <h1>Say hi!</h1>
            <div class="contact-form-container">
                <form id="contact-form" class="contact-form" action="https://formspree.io/f/mvzpjegv" method="POST">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message →</button>
                </form>
                <div id="form-status" class="form-status"></div>
            </div>
            <div class="contact-socials">
                <a href="https://www.linkedin.com/in/j%C4%81nis-stendzenieks-751409359/" target="_blank" class="contact-social-link">LinkedIn ↗</a>
                <a href="https://www.instagram.com/janis_ste/" target="_blank" class="contact-social-link">Instagram ↗</a>
            </div>
        </div>
        <div class="index-hero-accent"></div>
    </section>

    <footer class="footer">
        <a href="./index.html">← Back</a>
        <span>2026</span>
    </footer>

    <script>
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formStatus = document.getElementById('form-status');
            const formData = new FormData(this);
            fetch(this.action, {
                method: 'POST', body: formData,
                headers: { 'Accept': 'application/json' }
            }).then(r => {
                if (r.ok) {
                    formStatus.textContent = 'Thanks! I\'ll get back to you soon.';
                    formStatus.className = 'form-status success';
                    this.reset();
                } else {
                    formStatus.textContent = 'Something went wrong.';
                    formStatus.className = 'form-status error';
                }
            }).catch(() => {
                formStatus.textContent = 'Something went wrong.';
                formStatus.className = 'form-status error';
            });
            setTimeout(() => { formStatus.textContent = ''; formStatus.className = 'form-status'; }, 5000);
        });
    </script>
</body>
</html>
